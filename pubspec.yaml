name: budgetouvert
description: Application de transparence budgétaire citoyenne - République de Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  provider: ^6.1.2

  font_awesome_flutter: ^10.7.0

  flutter_svg: ^2.0.10

  # UI / animations
  smooth_page_indicator: ^1.1.0
  percent_indicator: ^4.2.3

  # Utilitaires
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  mobile_scanner: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true



  # Assets
  assets:
    - assets/images/
